<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Sternenbarone – ein Weltraum-Handelsspiel mit 3D-Brett für 2 bis 6 Piloten. Online mit Freunden, ohne Konto.">
<meta name="theme-color" content="#020308">
<title>Sternenbarone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: full-screen 3D holotable; frosted-glass HUD floats above it (players top-left, action dock bottom-center). */
:root{
  --bg:#020308;
  --glass:rgba(20,22,30,.56); --glass-strong:rgba(26,28,38,.78);
  --stroke:rgba(255,255,255,.09); --stroke2:rgba(255,255,255,.18);
  --text:#f5f5f7; --dim:rgba(235,235,245,.62); --faint:rgba(235,235,245,.38);
  --holo:#5ab8ff; --holo2:#2f8fff; --gold:#ffc35a; --red:#ff5a5f; --green:#4fe08a;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --hud:"Rajdhani","Inter",system-ui,sans-serif;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.4,.64,1);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{font:inherit;color:inherit}
#stage{position:fixed;inset:0}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 95% at 50% 45%,transparent 50%,rgba(0,0,0,.6) 100%)}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);border:1px solid var(--stroke);box-shadow:0 20px 60px -20px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06)}

/* top bar */
#topbar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;height:40px;padding:0 16px 0 12px;border-radius:999px;font-weight:600;letter-spacing:-.01em}
.brand svg{width:20px;height:20px;fill:none;stroke:var(--gold);stroke-width:1.6}
.brand .tag{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.12em;padding-left:10px;border-left:1px solid var(--stroke2)}
.tb-actions{display:flex;gap:6px;padding:4px;border-radius:999px}
.ic{width:36px;height:36px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--dim);transition:background .25s var(--ease),color .25s var(--ease),transform .2s var(--ease)}
.ic:hover{background:rgba(255,255,255,.1);color:var(--text)}
.ic:active{transform:scale(.92)}
.ic svg,.tool svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* views */
.view{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:1;transform:none;transition:opacity .6s var(--ease),transform .7s var(--ease),visibility 0s}
.view.is-hidden{opacity:0;transform:scale(1.015);visibility:hidden;transition:opacity .35s var(--ease),transform .45s var(--ease),visibility 0s linear .45s}
.view>*{pointer-events:auto}

/* menu */
#v-menu{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,420px);align-items:end;gap:48px;padding-top:calc(env(safe-area-inset-top,0px) + 90px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 48px);padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:max(48px,env(safe-area-inset-right,0px));box-sizing:border-box}
#v-menu>.hero{pointer-events:none}
.kicker{font-weight:600;font-size:15px;color:var(--gold);letter-spacing:-.005em}
.hero h1{margin:6px 0 0;font-size:clamp(48px,7.4vw,104px);font-weight:700;letter-spacing:-.045em;line-height:1;background:linear-gradient(180deg,#ffffff 30%,#9a9aa3 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.hero .sub{margin:16px 0 0;max-width:30ch;font-size:clamp(18px,1.7vw,23px);font-weight:500;line-height:1.35;color:var(--dim);letter-spacing:-.01em}
.menu-card{border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 150px);overflow-y:auto;box-sizing:border-box}
@media (max-width:900px){
  #v-menu{grid-template-columns:1fr;align-items:start;align-content:start;gap:24px;overflow-y:auto;pointer-events:auto;padding-top:calc(env(safe-area-inset-top,0px) + 84px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
  #v-menu>.hero{padding-top:min(34vh,280px)}
  .menu-card{max-height:none;overflow:visible}
}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:12px;background:rgba(255,255,255,.07);position:relative}
.seg button{border:0;background:transparent;height:34px;border-radius:9px;font-weight:600;font-size:14px;color:var(--dim);cursor:pointer;position:relative;z-index:1;transition:color .3s var(--ease)}
.seg button[aria-selected="true"]{color:var(--text)}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:9px;background:rgba(255,255,255,.14);box-shadow:0 2px 8px rgba(0,0,0,.35);transition:transform .45s var(--spring)}
.seg[data-tab="local"] .thumb{transform:translateX(100%)}
.pane{display:flex;flex-direction:column;gap:14px;animation:fadeUp .5s var(--ease)}
.field{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:13px;font-weight:600;color:var(--dim)}
.hint{font-size:13px;color:var(--faint);line-height:1.4}
input,select{font:inherit;font-size:16px;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--stroke);border-radius:12px;padding:11px 13px;width:100%;min-width:0;box-sizing:border-box;transition:border-color .25s var(--ease),background .25s var(--ease)}
input:focus,select:focus{outline:none;border-color:var(--holo);background:rgba(90,184,255,.08)}
button:focus-visible,.ship:focus-visible{outline:2px solid var(--holo);outline-offset:2px}
.ships{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.ship{display:grid;place-items:center;aspect-ratio:1;border-radius:14px;border:1px solid var(--stroke);background:rgba(255,255,255,.04);color:var(--faint);cursor:pointer;transition:all .35s var(--ease)}
.ship:hover{color:var(--dim);background:rgba(255,255,255,.08)}
.ship[aria-pressed="true"]{color:var(--gold);border-color:rgba(255,195,90,.6);background:rgba(255,195,90,.1);transform:scale(1.04)}
.ship-ic{width:26px;height:26px;fill:currentColor}
.shipname{font-size:13px;color:var(--dim);margin-top:-6px}
.row{display:flex;gap:8px;align-items:center}
.row>input{flex:1}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;border-radius:999px;border:0;background:rgba(255,255,255,.1);color:var(--text);font-weight:600;font-size:15px;letter-spacing:-.01em;cursor:pointer;white-space:nowrap;transition:transform .25s var(--ease),background .25s var(--ease),box-shadow .3s var(--ease),opacity .3s var(--ease)}
.pill:hover:not(:disabled){background:rgba(255,255,255,.16)}
.pill:active:not(:disabled){transform:scale(.97)}
.pill:disabled{opacity:.38;cursor:default}
.pill.primary{background:linear-gradient(180deg,#6cc4ff,#2f8fff);color:#fff;box-shadow:0 10px 28px -10px rgba(47,143,255,.9)}
.pill.primary:hover:not(:disabled){background:linear-gradient(180deg,#80ccff,#3d98ff)}
.pill.gold{background:linear-gradient(180deg,#ffd27a,#ffad33);color:#1a1100;box-shadow:0 10px 28px -10px rgba(255,173,51,.9)}
.pill.gold:hover:not(:disabled){background:linear-gradient(180deg,#ffdb8f,#ffb84a)}
.pill.danger{background:rgba(255,90,95,.16);color:#ff9a9d}
.pill.danger:hover:not(:disabled){background:rgba(255,90,95,.26)}
.pill.small{height:34px;padding:0 15px;font-size:13px}
.pill.wide{width:100%}
.textbtn{background:none;border:0;color:var(--holo);font-weight:500;cursor:pointer;padding:2px 0;align-self:flex-start}
.textbtn:hover{text-decoration:underline;text-underline-offset:3px}
.lobbies{display:flex;flex-direction:column;gap:6px}
.lob{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);animation:fadeUp .45s var(--ease)}
.lob b{font-family:var(--mono);font-weight:500;letter-spacing:.2em;color:var(--holo)}
.lob span{color:var(--dim);font-size:13px}
.divider{height:1px;background:var(--stroke)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper output{min-width:24px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.stepper .ic{background:rgba(255,255,255,.08);width:32px;height:32px;color:var(--text);font-size:18px;line-height:1}
.crew{display:flex;flex-direction:column;gap:8px}
.crew .row select{flex:0 0 132px}
.cdot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c);flex:none}

/* lobby + loading */
#v-lobby,#v-loading{display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.center-card{width:min(440px,100%);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box;max-height:calc(100vh - 120px);overflow-y:auto}
.code{font-family:var(--mono);font-size:56px;letter-spacing:.28em;line-height:1;font-weight:500;color:#fff;text-shadow:0 0 30px rgba(90,184,255,.6)}
.crewlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.crewlist li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);animation:fadeUp .45s var(--ease)}
.crewlist .ship-ic{color:var(--c);width:22px;height:22px}
.crewlist .who{flex:1;min-width:0;font-weight:600}
.crewlist small{color:var(--dim);font-weight:500}
.spinner{width:28px;height:28px;border-radius:50%;border:2.5px solid rgba(255,255,255,.15);border-top-color:var(--holo);animation:spin .9s linear infinite}

/* game */
#players{position:absolute;top:calc(env(safe-area-inset-top,0px) + 66px);left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;width:264px;max-height:calc(100vh - 100px);overflow-y:auto;padding:0 12px 12px 0;box-sizing:border-box;scrollbar-width:none}
#players::-webkit-scrollbar{display:none}
.chip{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:0 10px;padding:9px 12px 9px 9px;border-radius:18px;transition:transform .5s var(--ease),background .5s var(--ease),opacity .5s var(--ease),box-shadow .5s var(--ease);animation:fadeUp .6s var(--ease) both}
.chip-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);transition:box-shadow .5s var(--ease)}
.chip-ic .ship-ic{width:20px;height:20px}
.chip-nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.chip-meta{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-money{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;transition:color .4s var(--ease)}
.chip.active{background:var(--glass-strong);transform:translateX(6px);box-shadow:0 20px 60px -20px rgba(0,0,0,.7),inset 0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent)}
.chip.active .chip-ic{box-shadow:0 0 0 2px var(--c),0 0 22px var(--c)}
.chip.out{opacity:.4}
.chip.up .chip-money{color:var(--green)}
.chip.down .chip-money{color:var(--red)}
.chip-money.neg{color:var(--red)}
.potchip{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.potchip .chip-money{color:var(--gold)}
.potchip:hover{background:var(--glass-strong)}
.chip-props{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chip-props:empty{display:none}
.ptag{display:inline-flex;align-items:center;gap:5px;max-width:100%;font-size:11px;font-weight:600;line-height:1.2;padding:3px 8px 3px 6px;border-radius:999px;border:0;background:color-mix(in srgb,var(--g) 18%,transparent);color:var(--text);cursor:pointer;animation:fadeUp .5s var(--ease);transition:background .25s var(--ease),transform .2s var(--ease)}
.ptag:hover{background:color-mix(in srgb,var(--g) 32%,transparent)}
.ptag:active{transform:scale(.95)}
.ptag i{width:6px;height:6px;border-radius:50%;flex:none;background:var(--g);box-shadow:0 0 6px var(--g)}
.ptag .l,.ptag .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptag .s{display:none}
.ptag.full{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--g) 75%,transparent)}
.ptag.mort{opacity:.45;text-decoration:line-through}
.ptag b{font-weight:700;color:var(--green)}
.ptag b.cit{color:var(--gold)}
#dock{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);width:min(640px,calc(100% - 32px));border-radius:28px;padding:16px;box-sizing:border-box;transition:transform .6s var(--ease)}
#dockInner{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 16px;align-items:center}
#dockInner.swap{animation:fadeUp .5s var(--ease)}
.d-title{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.d-title .c{color:var(--c)}
.d-sub{font-size:14px;color:var(--dim);margin-top:2px}
.d-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.d-wide{grid-column:1/-1}
.deedline{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.05)}
.deedline .sw{width:10px;align-self:stretch;border-radius:4px;background:var(--g);box-shadow:0 0 14px var(--g)}
.deedline .nm{font-weight:600}
.deedline .pr{margin-left:auto;font-family:var(--mono);color:var(--gold)}
.d-tools{grid-column:1/-1;display:flex;gap:6px;border-top:1px solid var(--stroke);padding-top:12px;margin-top:2px}
.tool{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;height:38px;border-radius:12px;border:0;background:transparent;color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;transition:background .25s var(--ease),color .25s var(--ease)}
.tool:hover:not(:disabled){background:rgba(255,255,255,.08);color:var(--text)}
.tool:disabled{opacity:.35;cursor:default}
#dock.busy .d-actions .pill{opacity:.45;pointer-events:none}
#ticker{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:280px;border-radius:20px;padding:12px 14px;cursor:pointer;text-align:left;border:1px solid var(--stroke);color:var(--text)}
#ticker .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
#tickerText{font-size:13px;line-height:1.4;margin-top:4px;color:var(--dim);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#tickerText.swap{animation:fadeUp .45s var(--ease)}
@media (max-width:1240px){ #ticker{display:none} }
@media (max-width:760px){
  #players{top:calc(env(safe-area-inset-top,0px) + 62px);left:0;right:0;width:auto;flex-direction:row;overflow-x:auto;padding:2px max(16px,env(safe-area-inset-left,0px)) 10px;scrollbar-width:none;box-sizing:border-box}
  #players::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;width:168px;grid-template-columns:30px minmax(0,1fr);padding:7px 12px 7px 7px}
  .chip-ic{width:30px;height:30px;grid-row:span 2}
  .chip-money{grid-column:2;font-size:13px}
  .chip-meta{display:none}
  #players{align-items:flex-start;max-height:none}
  .ptag .l{display:none}
  .ptag .s{display:inline}
  .chip.active{transform:translateY(2px)}
  #dock{bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:calc(100% - 20px);padding:14px;border-radius:24px}
  #dockInner{grid-template-columns:1fr}
  .d-actions{justify-content:stretch}
  .d-actions .pill{flex:1}
  .brand .tag{display:none}
}

/* toasts, card, modal */
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 66px);left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92%,420px)}
.toast{padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;text-align:center;animation:toastIn .5s var(--spring)}
.toast.good{color:#fff;box-shadow:0 20px 60px -20px rgba(0,0,0,.7),inset 0 0 0 1px rgba(90,184,255,.5)}
.toast.bye{animation:toastOut .4s var(--ease) forwards}
#cardPop{position:fixed;inset:0;z-index:25;display:grid;place-items:center;padding:16px;cursor:pointer;pointer-events:auto}
.holo{width:min(360px,100%);border-radius:26px;padding:22px 24px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box;animation:cardIn .6s var(--spring)}
.holo.bye{animation:cardOut .4s var(--ease) forwards}
.holo .deck{display:flex;align-items:center;gap:10px;font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--holo)}
.holo.smug .deck{color:var(--gold)}
.holo .deck i{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor}
.holo p{margin:0;font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.3}
.holo small{color:var(--faint)}
#modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:opacity .4s var(--ease),visibility 0s}
#modal.is-hidden{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s var(--ease),visibility 0s linear .3s}
.sheet{width:min(560px,100%);max-height:calc(100vh - 32px);overflow-y:auto;border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box;background:var(--glass-strong);transform:none;opacity:1;transition:transform .55s var(--spring),opacity .4s var(--ease)}
#modal.is-hidden .sheet{transform:translateY(24px) scale(.97);opacity:0}
@media (max-width:600px){ #modal{place-items:end center;padding:0} .sheet{width:100%;border-radius:28px 28px 0 0;max-height:88vh;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 22px)} #modal.is-hidden .sheet{transform:translateY(100%)} }
.sheet h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.03em}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.deed{border-radius:20px;overflow:hidden;background:rgba(255,255,255,.04);border:1px solid var(--stroke)}
.deed .band{padding:16px 18px;background:linear-gradient(135deg,color-mix(in srgb,var(--g) 55%,#000) 0%,color-mix(in srgb,var(--g) 18%,#000) 100%);border-bottom:1px solid var(--stroke)}
.deed .band small{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.deed .band h3{margin:2px 0 0;font-size:24px;font-weight:700;letter-spacing:-.03em}
.deed table{width:100%;border-collapse:collapse;font-size:14px}
.deed td{padding:9px 18px;border-top:1px solid var(--stroke)}
.deed tr:first-child td{border-top:0}
.deed td:last-child{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.deed tr.on td{color:var(--holo)}
.deed p{margin:0;padding:16px 18px;color:var(--dim)}
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.05)}
.mrow .nm{font-weight:600;display:flex;align-items:center;gap:8px}
.mrow .sub{font-size:12px;color:var(--dim)}
.mrow .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:520px){ .mrow{grid-template-columns:1fr} .mrow .btns{justify-content:flex-start} }
.lvl{display:inline-flex;gap:3px;margin-left:4px}
.lvl i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.18)}
.lvl i.on{background:var(--green);box-shadow:0 0 8px var(--green)}
.lvl.cit i{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.bgroup{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:20px;background:color-mix(in srgb,var(--g) 9%,rgba(255,255,255,.03));border:1px solid color-mix(in srgb,var(--g) 32%,transparent)}
.bhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:6px}
.bhead b{font-weight:700}
.bhead .pill{margin-left:auto}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--stroke)}
.brow .nm{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.brow .sub{font-size:12px;color:var(--dim)}
.brow .btns{display:flex;gap:6px}
.pill svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tradecols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){ .tradecols{grid-template-columns:1fr} }
.tcol{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:18px;background:rgba(255,255,255,.04)}
.checks{display:flex;flex-direction:column;gap:2px;max-height:200px;overflow-y:auto}
.checks label{display:flex;gap:10px;align-items:center;font-size:14px;padding:7px 8px;border-radius:10px;cursor:pointer}
.checks label:hover{background:rgba(255,255,255,.05)}
.checks input{width:18px;height:18px;accent-color:var(--holo);flex:none}
.trade-sum{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--dim)}
.trade-sum b{color:var(--text)}
.loglist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.loglist li{font-size:14px;color:var(--dim);padding:8px 0;border-top:1px solid var(--stroke)}
.loglist li:first-child{color:var(--text);border-top:0}
.rules{display:flex;flex-direction:column;gap:12px;font-size:15px}
.rules p{margin:0;color:var(--dim)}
.rules dl{margin:0;display:grid;gap:10px}
.rules dt{font-weight:600}
.rules dd{margin:2px 0 0;color:var(--dim)}
.winner{font-size:28px;font-weight:700;letter-spacing:-.03em;background:linear-gradient(180deg,#ffe2a3,#ffad33);-webkit-background-clip:text;background-clip:text;color:transparent}

#volPop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 62px);right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;width:268px;max-width:calc(100vw - 32px);padding:6px 14px 6px 6px;border-radius:999px;box-sizing:border-box;transform-origin:top right;animation:toastIn .45s var(--spring)}
#volPop .ic{color:var(--text);flex:none}
#volVal{font-family:var(--mono);font-size:12px;color:var(--dim);min-width:30px;text-align:right;font-variant-numeric:tabular-nums}
#volRange{-webkit-appearance:none;appearance:none;flex:1;width:auto;min-width:0;height:6px;padding:0;margin:0;border:0;border-radius:999px;cursor:pointer;background:linear-gradient(90deg,#fff 0,#fff var(--p,70%),rgba(255,255,255,.18) var(--p,70%))}
#volRange::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 10px rgba(0,0,0,.55);transition:transform .2s var(--ease)}
#volRange:active::-webkit-slider-thumb{transform:scale(1.12)}
#volRange::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 10px rgba(0,0,0,.55)}
#volRange:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(90,184,255,.55)}
#wheel{position:fixed;inset:0;z-index:26;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.35)}
.wheel-card{width:min(380px,100%);border-radius:32px;padding:22px 22px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-sizing:border-box;background:var(--glass-strong);animation:cardIn .6s var(--spring)}
.wheel-card.bye{animation:cardOut .4s var(--ease) forwards}
.wheel-card h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.wheel-wrap{position:relative;width:min(300px,72vw);max-width:100%;aspect-ratio:1;margin-top:10px}
.wheel-svg{display:block;width:100%;height:100%;transform-origin:50% 50%;font-family:var(--hud);filter:drop-shadow(0 0 26px rgba(255,195,90,.2))}
.wheel-ptr{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--gold);filter:drop-shadow(0 0 8px var(--gold))}
.wseg.win{filter:brightness(1.8)}
.wseg.win path{stroke-opacity:1;stroke-width:2.5}
.wheel-res{min-height:42px;font-size:32px;font-weight:800;letter-spacing:-.03em;color:var(--faint)}
.wheel-res.bad,.wheel-res.good,.wheel-res.zero,.wheel-res.jackpot{animation:fadeUp .45s var(--ease)}
.wheel-res.bad{color:var(--red)} .wheel-res.good{color:var(--green)} .wheel-res.zero{color:var(--text)} .wheel-res.jackpot{color:var(--gold)}
#endFx{position:fixed;inset:0;z-index:35;display:grid;place-items:center;padding:16px;overflow:hidden;animation:fadeIn .6s var(--ease)}
#endFx.win{background:radial-gradient(circle at 50% 45%,rgba(60,38,8,.6),rgba(0,0,0,.82) 72%);-webkit-backdrop-filter:blur(10px) saturate(140%);backdrop-filter:blur(10px) saturate(140%)}
#endFx.lose{background:radial-gradient(circle at 50% 45%,rgba(255,50,60,.18),rgba(0,0,0,.75) 72%);-webkit-backdrop-filter:grayscale(.9) blur(6px);backdrop-filter:grayscale(.9) blur(6px)}
#endFx.bye{animation:fadeOut .5s var(--ease) forwards}
#endFx .rays{position:absolute;left:50%;top:45%;width:220vmax;height:220vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(255,195,90,.14) 0deg 5deg,transparent 5deg 15deg);-webkit-mask-image:radial-gradient(circle,#000 0%,transparent 42%);mask-image:radial-gradient(circle,#000 0%,transparent 42%);animation:spinRays 30s linear infinite;pointer-events:none}
#endFx .cracks{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(255,60,70,.05) 0 2px,transparent 2px 5px);animation:scan 6s linear infinite}
.end-card{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:600px;animation:endIn 1.1s var(--spring)}
.end-ship{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);box-shadow:0 0 0 2px var(--c),0 0 60px var(--c);animation:hover 3s ease-in-out infinite;margin-bottom:6px}
.end-ship .ship-ic{width:46px;height:46px}
.lose .end-ship{filter:grayscale(.6);animation:sink 2.4s var(--ease) forwards}
.end-kicker{font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.win .end-kicker{color:var(--gold)}
.lose .end-kicker{color:#ff8a8f}
.end-title{margin:0;font-size:clamp(60px,12vw,140px);font-weight:800;letter-spacing:-.055em;line-height:.95}
.win .end-title{background:linear-gradient(180deg,#fff7e0 10%,#ffc35a 55%,#c27a12 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 40px rgba(255,195,90,.45))}
.lose .end-title{color:#fff;text-shadow:0 0 34px rgba(255,60,70,.65);animation:glitch 2.6s steps(1) infinite}
.end-sub{margin:0;font-size:clamp(17px,2vw,22px);font-weight:500;color:var(--dim);text-wrap:balance}
.end-stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.end-stats div{padding:10px 18px;border-radius:16px;background:rgba(255,255,255,.07);font-size:13px;color:var(--dim)}
.end-stats b{display:block;font-family:var(--mono);font-size:20px;font-weight:500;color:var(--text)}
@keyframes endIn{from{opacity:0;transform:scale(.8) translateY(30px);filter:blur(14px)}to{opacity:1;transform:none;filter:none}}
@keyframes spinRays{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes glitch{0%,100%{transform:none}90%{transform:translate(3px,-1px) skewX(5deg)}93%{transform:translate(-4px,1px)}96%{transform:none}}
@keyframes hover{50%{transform:translateY(-8px)}}
@keyframes sink{to{transform:translateY(10px) rotate(-14deg);opacity:.75}}
@keyframes scan{to{background-position:0 100px}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-8px) scale(.97)}}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.92) rotateX(18deg)}to{opacity:1;transform:none}}
@keyframes cardOut{to{opacity:0;transform:translateY(-16px) scale(.96)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="stage"><canvas id="c" aria-label="3D-Spielbrett"></canvas><div id="vignette"></div></div>

<header id="topbar">
  <div class="brand glass"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/><circle cx="12" cy="12" r="2.2"/></svg><span>Sternenbarone</span><span class="tag" id="gameTag" hidden></span></div>
  <div class="tb-actions glass">
    <button class="ic" id="btnSound" type="button" aria-label="Lautstärke" aria-expanded="false" aria-controls="volPop"></button>
    <button class="ic" id="btnCam" type="button" aria-label="Kameraansicht wechseln" hidden></button>
    <button class="ic" id="btnRules" type="button" aria-label="Spielregeln"></button>
    <button class="ic" id="btnExit" type="button" aria-label="Zum Hauptmenü" hidden></button>
  </div>
  <div id="volPop" class="glass" hidden><button class="ic" id="volMute" type="button" aria-label="Stumm schalten"></button><input type="range" id="volRange" min="0" max="100" step="1" aria-label="Lautstärke"><span id="volVal"></span></div>
</header>

<section id="v-menu" class="view"></section>
<section id="v-loading" class="view is-hidden"><div class="center-card glass" style="align-items:center;text-align:center"><div class="spinner"></div><div><div style="font-weight:600;font-size:17px">Verbinde mit dem Hangar</div><div class="hint" id="loadingHint">Der Spielstand wird geladen.</div></div><button class="pill small" data-act="menu">Abbrechen</button></div></section>
<section id="v-lobby" class="view is-hidden"><div class="center-card glass" id="lobbyCard"></div></section>
<section id="v-game" class="view is-hidden">
  <div id="players"></div>
  <div id="dock" class="glass"><div id="dockInner"></div></div>
  <button id="ticker" class="glass" type="button" data-act="log"><div class="lbl">Logbuch</div><div id="tickerText"></div></button>
</section>

<div id="toasts" aria-live="polite"></div>
<div id="cardPop" hidden></div>
<div id="wheel" hidden></div>
<div id="endFx" hidden></div>
<div id="modal" class="is-hidden" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
'use strict';
/* ============================================================ helpers */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n < 0 ? '−' : '') + Math.abs(Math.round(n)).toLocaleString('de-DE') + ' Cr';
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, REDUCED ? Math.min(ms,80) : ms));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const damp = (a,b,l,dt) => a + (b-a) * (1 - Math.exp(-l*dt));
const angDiff = (a,b) => { let d=a-b; while (d>Math.PI) d-=Math.PI*2; while (d<-Math.PI) d+=Math.PI*2; return d; };
const EASE = {
  outCubic: t => 1-Math.pow(1-t,3), inCubic: t => t*t*t,
  inOutSine: t => -(Math.cos(Math.PI*t)-1)/2,
  inOutCubic: t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2,
};
function rnd6(){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % 6 + 1; }

/* ============================================================ board data */
const GROUPS = [

const P = (name,g,price,rent) => ({t:'prop',name,g,price,rent});
const SPACES = [

  {t:'card', deck:'funk', name:'Holo-Funk'},
  P('Rostfels Ondo',0,60,[4,20,60,180,320,450]),
  {t:'tax', name:'Andockgebühr', amount:200},
  {t:'gate', name:'Sprungtor Nord', price:200},
  P('Eiswelt Hjalm',1,100,[6,30,90,270,400,550]),
  {t:'card', deck:'schmuggel', name:'Schmugglerfunk'},
  P('Frostring Veil',1,100,[6,30,90,270,400,550]),
  P('Glimmernebel Tsu',1,120,[8,40,100,300,450,600]),

  {t:'gate', name:'Sprungtor Ost', price:200},
  P('Wüstenwelt Saharr',3,180,[14,70,200,550,750,950]),
  {t:'card', deck:'funk', name:'Holo-Funk'},
  P('Dünenstadt Qadim',3,180,[14,70,200,550,750,950]),

];
const GATES = [5,15,25,35], UTILS = [12,28];
const BUYABLE = i => ['prop','gate','util'].includes(SPACES[i].t);
const GROUP_IDX = GROUPS.map((_,g) => SPACES.map((s,i) => (s.t==='prop' && s.g===g) ? i : -1).filter(i => i >= 0));
const spaceColor = i => { const s = SPACES[i]; return s.t==='prop' ? GROUPS[s.g].color : s.t==='gate' ? '#b9c7dc' : s.t==='util' ? '#ffffff' : '#5ab8ff'; };
const STROKE = 'style="fill:none;stroke:currentColor;stroke-width:3"';
const SHIPS = [
  {name:'Pfeiljäger',  svg:'<path d="M20 3l3 13 13 9v4l-13-4-1 9h-4l-1-9-13 4v-4l13-9z"/>'},

  {name:'Frachter',    svg:'<rect x="13" y="5" width="14" height="27" rx="3"/><rect x="5" y="19" width="6" height="15" rx="2"/><rect x="29" y="19" width="6" height="15" rx="2"/>'},

const ICON = {
  sound:'<svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>',

  swap:'<svg viewBox="0 0 24 24"><path d="M7 7h12l-3.5-3.5M17 17H5l3.5 3.5"/></svg>',
  list:'<svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  build:'<svg viewBox="0 0 24 24"><path d="M3.5 20h17M6 20v-7.5L12 7l6 5.5V20"/><path d="M10 20v-4.5h4V20M12 3v4"/></svg>',
};

/* ============================================================ cards */
function nextGate(pos){ for (let k=1;k<=40;k++){ const j=(pos+k)%40; if (GATES.includes(j)) return j; } return 5; }
function buildingCounts(S,id){ let h=0,c=0; for (const i in S.props){ const pr=S.props[i]; if (pr.owner!==id) continue; if (pr.houses===5) c++; else h+=pr.houses; } return [h,c]; }
const CARDS = {
  schmuggel: [
    {x:'Hyperraumsprung zum Raumhafen Nova. Kassiere 200 Cr.', f:(S,id)=>moveTo(S,id,0)},

const round5 = n => Math.round(n/5)*5;
function wealth(S,id){ let w=Math.max(0,S.players[id].money); for (const i in S.props){ const pr=S.props[i]; if (pr.owner!==id) continue; const sp=SPACES[i]; if (!pr.mort) w+=sp.price; if (sp.t==='prop') w+=pr.houses*GROUPS[sp.g].house; } return w; }
function spin(S,id,title,segs){ const k=Math.floor(Math.random()*segs.length); emit(S,{t:'wheel',id,title,segs:segs.map(x=>({l:x.l,c:x.c})),k}); return segs[k]; }
const WHEEL_TAX=[{l:'0 %',v:0,c:'zero'},{l:'5 %',v:5,c:'bad'},{l:'+5 %',v:-5,c:'good'},{l:'10 %',v:10,c:'bad'},{l:'2 %',v:2,c:'bad'},{l:'15 %',v:15,c:'bad'},{l:'8 %',v:8,c:'bad'},{l:'12 %',v:12,c:'bad'}];

const WHEEL_BET=[{l:'0×',v:0,c:'bad'},{l:'2×',v:2,c:'good'},{l:'0×',v:0,c:'bad'},{l:'1×',v:1,c:'zero'},{l:'½×',v:.5,c:'bad'},{l:'3×',v:3,c:'jackpot'},{l:'1,5×',v:1.5,c:'good'},{l:'0×',v:0,c:'bad'}];
const BET_STAKES=[50,100,250];
function cardWealthTax(S,id){
  const w=Math.max(0,S.players[id].money), x=spin(S,id,'Vermögensabgabe',WHEEL_TAX), amt=round5(w*Math.abs(x.v)/100);
  if (!x.v || !amt){ log(S,`Glück gehabt: ${nm(S,id)} zahlt keine Vermögensabgabe.`); return; }
  if (x.v>0){ charge(S,id,amt,null); log(S,`Das Glücksrad zeigt ${x.v} %: ${nm(S,id)} zahlt ${amt} Cr Vermögensabgabe.`); }

}
function cardGuildWheel(S,id){
  const x=spin(S,id,'Glücksrad der Handelsgilde',WHEEL_GUILD);

}
function cardFlightFee(S,id){ const n=Object.values(S.props).filter(pr=>pr.owner===id).length, a=25+n*15; charge(S,id,a,null); log(S,`${nm(S,id)} zahlt ${a} Cr Fluggebühr (${n} ${n===1?'Welt':'Welten'}).`); }
function cardFuel(S,id){ const a=round5(Math.max(0,S.players[id].money)*0.1); if (a){ charge(S,id,a,null); log(S,`${nm(S,id)} zahlt ${a} Cr für Treibstoff.`); } }
function cardStorm(S,id){ let v=0; for (const i in S.props){ const pr=S.props[i]; if (pr.owner===id && !pr.mort) v+=SPACES[i].price; } const a=round5(v*0.05); if (a){ charge(S,id,a,null); log(S,`${nm(S,id)} zahlt ${a} Cr Sturmreparaturen.`); } else log(S,`${nm(S,id)} hat keine Welten – der Sturm zieht vorbei.`); }
function cardAudit(S){
  const alive=S.order.filter(o=>!S.players[o].out); if (alive.length<2) return;
  const sorted=alive.slice().sort((a,b)=>S.players[b].money-S.players[a].money), rich=sorted[0], poor=sorted[sorted.length-1];

  if (rich===poor || !a || S.players[rich].money===S.players[poor].money) return;
  charge(S,rich,a,poor); log(S,`Steuerprüfung: ${nm(S,rich)} zahlt ${a} Cr an ${nm(S,poor)}.`);

function cardBet(S,id){ S.phase='bet'; log(S,`${nm(S,id)} darf eine Schmugglerwette eingehen.`); }

/* ============================================================ engine

const curId = S => S.order[S.turn];
const nm = (S,id) => S.players[id]?.name || 'Unbekannt';
function emit(S,e){ if (!S.ev) S.ev={seq:0,list:[]}; S.ev.list.push(e); }
function log(S,m){ S.logN=(S.logN||0)+1; S.log.push({n:S.logN,m}); if (S.log.length>60) S.log.splice(0,S.log.length-60); }
function credit(S,id,a){ S.players[id].money+=a; emit(S,{t:'gain',id,amt:a}); }
function charge(S,id,a,to){ const p=S.players[id]; p.money-=a; if (to) S.players[to].money+=a; else S.pot=(S.pot||0)+a; if (p.money<0) p.debtTo=to||null; emit(S,{t:'pay',from:id,to:to||null,amt:a}); }
function newGameState(list, extra){

  list.forEach((p,i) => { S.order.push(p.id); S.players[p.id] = {name:p.name,ship:p.ship,color:COLORS[i],pos:0,money:1500,jail:0,jailCards:0,out:false,debtTo:null}; });
  SPACES.forEach((s,i) => { if (BUYABLE(i)) S.props[i] = {owner:null,houses:0,mort:false}; });
  log(S, `Die Flotte startet am Raumhafen Nova. ${nm(S,S.order[0])} beginnt.`);
  return S;
}
function moveBy(S,id,n,opt){
  const p=S.players[id], from=p.pos, path=[];
  for (let k=1;k<=n;k++) path.push((from+k)%40);
  p.pos=(from+n)%40; emit(S,{t:'move',id,path});

function moveTo(S,id,target,opt){ moveBy(S,id,(target-S.players[id].pos+40)%40,opt); }
function moveBack(S,id,n){
  const p=S.players[id], from=p.pos, path=[];

}
function toJail(S,id){
  const p=S.players[id]; p.pos=10; p.jail=1; S.again=false; S.doubles=0;

function ownsGroup(S,id,g){ return GROUP_IDX[g].every(j => S.props[j].owner===id); }
function calcRent(S,i,dice){
  const sp=SPACES[i], pr=S.props[i], o=pr.owner;
  if (sp.t==='prop'){ if (pr.houses>0) return sp.rent[pr.houses]; return ownsGroup(S,o,sp.g) ? sp.rent[0]*2 : sp.rent[0]; }
  if (sp.t==='gate'){ const n=GATES.filter(j=>S.props[j].owner===o).length; return 25*2**(n-1); }
  if (sp.t==='util'){ const n=UTILS.filter(j=>S.props[j].owner===o).length; return dice*(n===2?10:4); }
  return 0;
}
function land(S,id,opt={}){
  const p=S.players[id], i=p.pos, sp=SPACES[i];
  switch (sp.t){
    case 'prop': case 'gate': case 'util': {
      const pr=S.props[i];
      if (!pr.owner){ S.phase='buy'; S.pendingBuy=i; return; }
      if (pr.owner===id) return;
      if (pr.mort){ log(S,`${sp.name} ist verpfändet – keine Landegebühr.`); return; }
      if (S.players[pr.owner].out) return;
      let rent = calcRent(S,i,S.lastRoll ? S.lastRoll.d[0]+S.lastRoll.d[1] : 7);
      if (opt && opt.mult) rent *= opt.mult;
      charge(S,id,rent,pr.owner);
      log(S,`${p.name} zahlt ${rent} Cr Landegebühr an ${nm(S,pr.owner)} (${sp.name}).`);
      return;
    }
    case 'tax': charge(S,id,sp.amount,null); log(S,`${p.name} zahlt ${sp.amount} Cr ${sp.name} in den Pott.`); return;
    case 'card': drawCard(S,id,sp.deck); return;
    case 'tojail': log(S,`Ein Abfangkreuzer stellt ${p.name}!`); toJail(S,id); return;
    case 'free': {
      const a=S.pot||0;
      if (a>0){ S.pot=0; p.money+=a; emit(S,{t:'jackpot',id,amt:a}); log(S,`${p.name} landet auf dem Nebel-Rastplatz und räumt den Pott ab: ${a} Cr!`); }
      else log(S,`${p.name} legt eine Pause am Nebel-Rastplatz ein – der Pott ist leer.`);
      return;
    }
    case 'jail': if (!p.jail) log(S,`${p.name} besucht die Arrestbake nur.`); return;

}
function drawCard(S,id,deck){
  const list=CARDS[deck], k=Math.floor(Math.random()*list.length);
  emit(S,{t:'card',deck,k,who:id});

}
function settle(S){ const p=S.players[curId(S)]; if (p.jail>0) S.again=false; if (S.phase!=='buy' && S.phase!=='bet') S.phase = S.again ? 'roll' : 'end'; }
function actRoll(S){
  if (S.status!=='playing' || S.phase!=='roll' || S.trade) return false;
  const id=curId(S), p=S.players[id];
  if (p.money<0) return false;

    if (dbl){ p.jail=0; log(S,`${p.name} würfelt einen Pasch (${a}+${b}) und entkommt der Arrestbake.`); moveBy(S,id,a+b); }

function actBuy(S){
  if (S.phase!=='buy') return false;
  const id=curId(S), i=S.pendingBuy, sp=SPACES[i], p=S.players[id];
  if (p.money<sp.price) return false;
  p.money-=sp.price; S.props[i].owner=id; S.pendingBuy=null; S.phase='x';
  emit(S,{t:'buy',id,i,price:sp.price});

function actBet(S,stake){

function actPass(S){

function actPayJail(S){

function actJailCard(S){
  const id=curId(S), p=S.players[id];

  p.jailCards--; p.jail=0; emit(S,{t:'free',id}); log(S,`${p.name} nutzt eine Freikarte und verlässt die Arrestbake.`);

function nextTurn(S){
  S.doubles=0; S.again=false; S.pendingBuy=null; S.trade=null;

  if (t<=S.turn) S.round=(S.round||1)+1;
  S.turn=t; S.phase='roll';
  emit(S,{t:'turn',id:curId(S)});
  log(S,`${nm(S,curId(S))} ist am Zug.`);
}
function actEnd(S){ const id=curId(S); if (S.phase!=='end' || S.trade || S.players[id].money<0) return false; nextTurn(S); }
function checkWinner(S){

function actBankrupt(S,id){

  emit(S,{t:'bankrupt',id});
  for (const i in S.props){ const pr=S.props[i]; if (pr.owner!==id) continue; pr.houses=0; if (cred) pr.owner=cred; else { pr.owner=null; pr.mort=false; } }
  if (cred){ if (p.money<0) S.players[cred].money+=p.money; S.players[cred].jailCards+=p.jailCards; }
  else if (p.money<0) S.pot=Math.max(0,(S.pot||0)+p.money);
  p.money=0; p.out=true; p.jail=0; p.jailCards=0;
  log(S,`${p.name} ist bankrott${cred?` – alle Planeten gehen an ${nm(S,cred)}`:' – alle Planeten fallen an die Bank'}.`);

function actForceSkip(S){

const unmortCost = i => Math.ceil(SPACES[i].price/2*1.1);
function canManage(S,id){ return S.status==='playing' && curId(S)===id && (S.phase==='roll'||S.phase==='end') && !S.trade; }
function buildErr(S,id,i){

  if (!ownsGroup(S,id,sp.g)) return 'Du brauchst alle Planeten der Gruppe.';
  const grp=GROUP_IDX[sp.g];
  if (grp.some(j=>S.props[j].mort)) return 'Ein Planet der Gruppe ist verpfändet.';
  if (pr.houses>=5) return 'Voll ausgebaut.';
  if (pr.houses>Math.min(...grp.map(j=>S.props[j].houses))) return 'Baue gleichmäßig über die Gruppe.';

  return null;

function sellErr(S,id,i){
  const sp=SPACES[i], pr=S.props[i];
  if (sp.t!=='prop' || pr.owner!==id || pr.houses<1) return 'Nichts zu verkaufen.';
  if (pr.houses<Math.max(...GROUP_IDX[sp.g].map(j=>S.props[j].houses))) return 'Baue gleichmäßig zurück.';
  return null;

function mortErr(S,id,i){

}
function unmortErr(S,id,i){ const pr=S.props[i]; if (pr.owner!==id || !pr.mort) return 'Nicht möglich.'; if (S.players[id].money<unmortCost(i)) return 'Nicht genug Credits.'; return null; }
function actBuild(S,id,i){ if (!canManage(S,id) || buildErr(S,id,i)) return false; const sp=SPACES[i], cost=GROUPS[sp.g].house; S.props[i].houses++; S.players[id].money-=cost; emit(S,{t:'build',id,i,amt:cost}); log(S,`${nm(S,id)} errichtet ${S.props[i].houses===5?'eine Zitadelle':'einen Außenposten'} auf ${sp.name}.`); }
function actBuildGroup(S,id,g){
  if (!canManage(S,id)) return false;
  const order=GROUP_IDX[g].slice().sort((a,b)=>S.props[a].houses-S.props[b].houses||a-b);
  let n=0; for (const i of order){ if (!buildErr(S,id,i)){ actBuild(S,id,i); n++; } }
  if (!n) return false;
}
function canBuildAny(S,id){ return Object.keys(S.props).some(i=>S.props[i].owner===id && SPACES[i].t==='prop' && !buildErr(S,id,+i)); }
function actSell(S,id,i){ if (!canManage(S,id) || sellErr(S,id,i)) return false; const sp=SPACES[i], amt=GROUPS[sp.g].house/2; S.props[i].houses--; S.players[id].money+=amt; emit(S,{t:'sell',id,i,amt}); log(S,`${nm(S,id)} verkauft einen Bau auf ${sp.name}.`); }
function actMort(S,id,i){ if (!canManage(S,id) || mortErr(S,id,i)) return false; const amt=SPACES[i].price/2; S.props[i].mort=true; S.players[id].money+=amt; emit(S,{t:'mort',id,i,amt}); log(S,`${nm(S,id)} verpfändet ${SPACES[i].name} für ${amt} Cr.`); }
function actUnmort(S,id,i){ if (!canManage(S,id) || unmortErr(S,id,i)) return false; const amt=unmortCost(i); S.props[i].mort=false; S.players[id].money-=amt; emit(S,{t:'unmort',id,i,amt}); log(S,`${nm(S,id)} löst ${SPACES[i].name} aus.`); }
function tradable(S,id){ return Object.keys(S.props).map(Number).filter(i => { const pr=S.props[i]; if (pr.owner!==id) return false; const sp=SPACES[i]; return sp.t!=='prop' || GROUP_IDX[sp.g].every(j=>S.props[j].houses===0); }); }
function tradeErr(S,t){
  const A=S.players[t.from], B=S.players[t.to];
  if (!A || !B || A.out || B.out) return 'Ein Spieler ist nicht mehr dabei.';
  if (t.give.money<0 || t.get.money<0) return 'Ungültiger Betrag.';
  if (t.give.money>A.money) return `${A.name} hat nicht genug Credits.`;
  if (t.get.money>B.money) return `${B.name} hat nicht genug Credits.`;
  const ta=tradable(S,t.from), tb=tradable(S,t.to);
  if (!t.give.props.every(i=>ta.includes(i)) || !t.get.props.every(i=>tb.includes(i))) return 'Die Planeten sind nicht mehr handelbar.';
  if (!t.give.props.length && !t.get.props.length && !t.give.money && !t.get.money) return 'Das Angebot ist leer.';
  return null;
}
function actPropose(S,t){
  if (!canManage(S,t.from) || tradeErr(S,t)) return false;
  S.trade={...t,seq:(S.trade?.seq||0)+1};
  emit(S,{t:'offer',from:t.from,to:t.to});
  log(S,`${nm(S,t.from)} bietet ${nm(S,t.to)} einen Handel an.`);
}
function actTradeAnswer(S,accept){
  const t=S.trade; if (!t) return false;
  if (!accept){ log(S,`${nm(S,t.to)} lehnt den Handel ab.`); S.trade=null; return; }
  const err=tradeErr(S,t);
  if (err){ log(S,`Handel geplatzt: ${err}`); S.trade=null; return; }
  for (const i of t.give.props) S.props[i].owner=t.to;
  for (const i of t.get.props) S.props[i].owner=t.from;
  S.players[t.from].money += t.get.money - t.give.money;
  S.players[t.to].money += t.give.money - t.get.money;
  emit(S,{t:'trade',from:t.from,to:t.to,a:t.get.money-t.give.money});
  log(S,`${nm(S,t.to)} nimmt den Handel mit ${nm(S,t.from)} an.`);
  S.trade=null;
}
function actTradeCancel(S){ if (!S.trade) return false; log(S,`${nm(S,S.trade.from)} zieht das Angebot zurück.`); S.trade=null; }

  ctx:null, master:null, on: store.get('sb-sound') !== false, noiseBuf:null, vol: store.get('sb-vol') ?? 70,
  setVol(v){ this.vol=v; store.set('sb-vol',v); if (this.master) this.master.gain.setTargetAtTime(v/100*0.8,this.ctx.currentTime,0.03); },
  init(){
    if (this.ctx){ if (this.ctx.state==='suspended') this.ctx.resume(); return; }
    const C=window.AudioContext||window.webkitAudioContext; if (!C) return;
    try {
      this.ctx=new C(); const comp=this.ctx.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=4;

  tone(freq,dur,o={}){
    const c=this.ctx, t=c.currentTime+(o.delay||0), osc=c.createOscillator(), g=c.createGain();
    osc.type=o.type||'sine'; osc.frequency.setValueAtTime(freq,t); if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide,t+dur);

    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    osc.connect(g); g.connect(this.master); osc.start(t); osc.stop(t+dur+0.05);
  },
  noise(dur,o={}){
    const c=this.ctx, t=c.currentTime+(o.delay||0), src=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
    src.buffer=this.noiseBuf; f.type=o.filter||'bandpass'; f.Q.value=o.q??1; f.frequency.setValueAtTime(o.freq||1000,t); if (o.to) f.frequency.exponentialRampToValueAtTime(o.to,t+dur);

    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+a); g.gain.setValueAtTime(v,t+Math.max(a,dur*(o.hold??0.2))); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);

  play(name,arg){
    if (!this.on || !this.ctx || this.vol<=0) return;

      switch(name){

        case 'lose': [392,330,262,196].forEach((f,k)=>this.tone(f,.7,{type:'triangle',gain:.08,delay:k*.24})); this.noise(2,{filter:'lowpass',freq:320,to:60,q:.5,gain:.16,delay:.3,hold:.4}); break;

        case 'buy': this.tone(659,.3,{gain:.1}); this.tone(988,.4,{gain:.09,delay:.09}); this.tone(1319,.6,{gain:.07,delay:.18}); break;
        case 'build': this.tone(392,.14,{type:'triangle',gain:.1}); this.tone(587,.26,{type:'triangle',gain:.09,delay:.08}); this.noise(.2,{freq:800,q:3,gain:.06}); break;

function spawn(p,v,life,c){ const i=pHead; pHead=(pHead+1)%PN; pPos[i*3]=p.x; pPos[i*3+1]=p.y; pPos[i*3+2]=p.z; pVel[i*3]=v.x; pVel[i*3+1]=v.y; pVel[i*3+2]=v.z; pLife[i]=pMax[i]=life; pBase[i*3]=c.r; pBase[i*3+1]=c.g; pBase[i*3+2]=c.b; }
const _v=V3();
function burst(p,color,n=24,speed=1.6){ const c=new THREE.Color(color).multiplyScalar(1.4); for (let k=0;k<n;k++){ _v.set(Math.random()-.5,Math.random()*.8,Math.random()-.5).normalize().multiplyScalar(speed*(.4+Math.random()*.8)); spawn(p,_v,.5+Math.random()*.6,c); } }
function updateParticles(dt){
  const drag=1-Math.min(1,dt*2.2);
  for (let i=0;i<PN;i++){
    if (pLife[i]<=0) continue;
    pLife[i]-=dt;
    if (pLife[i]<=0){ pPos[i*3+1]=-999; pCol[i*3]=pCol[i*3+1]=pCol[i*3+2]=0; continue; }
    pPos[i*3]+=pVel[i*3]*dt; pPos[i*3+1]+=pVel[i*3+1]*dt; pPos[i*3+2]+=pVel[i*3+2]*dt;
    pVel[i*3]*=drag; pVel[i*3+1]*=drag; pVel[i*3+2]*=drag;
    const k=pLife[i]/pMax[i]; pCol[i*3]=pBase[i*3]*k; pCol[i*3+1]=pBase[i*3+1]*k; pCol[i*3+2]=pBase[i*3+2]*k;
  }

}

async function commit(fn){

function openHostPeer(code){

      conn.send({type:'hello',id:myId,name:pilotName(),ship:pickedShip});
    });
    conn.on('data',msg=>{ if (conn===hostConn) clientHandle(msg); });
    conn.on('close',()=>{ if (conn!==hostConn) return; if (via==='direct') clientLost(code); else useRelay(code); });
    conn.on('error',()=>{ if (conn!==hostConn) return; if (via==='direct') clientLost(code); else useRelay(code); });
  };
  fallbackTimer=setTimeout(()=>{ if (!(hostConn && hostConn.open)){ if (!state) $('#loadingHint').textContent='Direktverbindung klappt nicht – verbinde über den Relay-Server …'; useRelay(code); } },7000);
  if (!peer || peer.destroyed){
    let p; try { p=new Peer(PEER_OPTS); } catch(e){ return useRelay(code); }
    peer=p;
    p.on('open',go);
    p.on('error',()=>{ if (peer!==p) return; if (hostConn && hostConn.open) return; useRelay(code); });
    p.on('disconnected',()=>{ if (peer===p && !p.destroyed) setTimeout(()=>{ try { if (!p.destroyed) p.reconnect(); } catch(e){} },1500); });
  } else if (peer.open) go(); else peer.once('open',go);
}
function useRelay(code,idx=0){
  if (mode!=='online' || isHost || gameCode!==code) return;
  if (idx===0){ if (relayPending) return; if (hostConn && hostConn.open && via==='direct') return; }
  clearTimeout(fallbackTimer);
  const old=hostConn; hostConn=null; if (old) try { old.close(); } catch(e){}
  if (relayClient){ try { relayClient.end(true); } catch(e){} relayClient=null; }
  if (!RELAY_ON() || idx>=RELAYS.length){ relayPending=false; return relayFailed(code); }
  relayPending=true; const tok=++relayToken;
  let c; try { c=mqtt.connect(RELAYS[idx],{clientId:'sbc_'+myId+'_'+rid(),clean:true,connectTimeout:7000,reconnectPeriod:0,keepalive:30,will:{topic:topic(code,'up'),payload:JSON.stringify({type:'gone',from:myId}),qos:1,retain:false}}); }
  catch(e){ return useRelay(code,idx+1); }
  relayClient=c;
  const vc={open:false,send(m){ c.publish(topic(code,'up'),JSON.stringify({...m,from:myId}),{qos:1}); },close(){ this.open=false; try { c.end(true); } catch(e){} }};
  let answered=false, settled=false;
  const next=()=>{ if (settled || tok!==relayToken) return; settled=true; clearTimeout(noAnswer); if (hostConn===vc) hostConn=null; try { c.end(true); } catch(e){} if (relayClient===c) relayClient=null; useRelay(code,idx+1); };
  const noAnswer=setTimeout(()=>{ if (!answered) next(); },9000);
  c.on('connect',()=>{
    if (tok!==relayToken) return;
    c.subscribe(topic(code,'down',myId),{qos:1},err=>{
      if (tok!==relayToken) return; if (err) return next();
      vc.open=true; hostConn=vc; via='relay';
      vc.send({type:'hello',id:myId,name:pilotName(),ship:pickedShip});
    });
  });
  c.on('message',(t,buf)=>{
    if (tok!==relayToken || hostConn!==vc) return;
    let m; try { m=JSON.parse(buf.toString()); } catch(e){ return; }
    if (!answered){ answered=true; settled=true; relayPending=false; clearTimeout(noAnswer); if (lastVia!=='relay' && state) toast('Direktverbindung abgebrochen – weiter über den Relay-Server.'); lastVia='relay'; updateConnTag(); if (lostToast){ toast('Wieder verbunden.',true); lostToast=false; } }
    clientHandle(m);
  });
  c.on('error',()=>{ if (!answered) next(); });
  c.on('close',()=>{ if (tok!==relayToken) return; if (!answered){ next(); return; } if (hostConn===vc){ vc.open=false; hostConn=null; clientLost(code); } });
}
function relayFailed(code){
  if (!state){ clearTimeout(joinTimer); toast(`Kein offener Hangar mit dem Code ${code}. Ist der Gastgeber online?`); store.del('sb-online'); goMenu(); }
  else clientLost(code);
}
function clientLost(code){
  if (mode!=='online' || isHost || gameCode!==code) return;
  if (!lostToast && state){ toast('Verbindung zum Gastgeber unterbrochen – verbinde neu …'); lostToast=true; }
  writing=false; updateBusy();
  clearTimeout(retryTimer); retryTimer=setTimeout(()=>{ if (mode==='online' && !isHost && gameCode===code) connectToHost(code); },3000);
}
function clientHandle(msg){
  if (!msg || typeof msg!=='object') return;
  if (msg.type==='state' && msg.state && typeof msg.state==='object'){ clearTimeout(joinTimer); clearTimeout(writeTimer); writing=false; onState(msg.state); updateBusy(); }
  else if (msg.type==='error') toast(String(msg.msg||'Fehler'));
  else if (msg.type==='reject'){ writing=false; updateBusy(); sfx.play('error'); toast('Das kam nicht durch – jemand war schneller. Bitte noch einmal.'); }
  else if (msg.type==='closed'){ toast('Der Gastgeber hat den Hangar aufgelöst.'); store.del('sb-online'); goMenu(); }
}
async function createOnline(){
  if (!P2P) return toast('Die Online-Verbindung konnte nicht geladen werden. Prüfe deine Internetverbindung.');
  const name=pilotName(); store.set('sb-name',name);
  detach(); showView('loading'); $('#loadingHint').textContent='Hangar wird eröffnet …';
  let p=null, code=genCode();
  if (typeof window.Peer==='function'){
    for (let k=0;k<4;k++){ try { p=await openHostPeer(code); break; } catch(e){ if (e && e.type==='unavailable-id'){ code=genCode(); continue; } p=null; break; } }
  }
  if (!p && !RELAY_ON()){ toast('Der Vermittlungsdienst ist gerade nicht erreichbar. Versuch es gleich noch einmal.'); goMenu(); return; }
  peer=p; isHost=true; mode='online'; gameCode=code; if (p) wireHostPeer(p); hostOpenRelays(code);
  store.set('sb-online',{code,host:true});
  state=null; hadGameState=false;
  const now=Date.now();
  hostAccept({v:2,code,host:myId,status:'lobby',createdAt:now,lobby:{[myId]:{name,ship:pickedShip,t:now}},rev:0});
}
function joinOnline(code){
  code=(code||'').toUpperCase().replace(/[^A-Z]/g,'');
  if (code.length!==4) return toast('Der Code hat vier Buchstaben.');
  if (!P2P) return toast('Die Online-Verbindung konnte nicht geladen werden. Prüfe deine Internetverbindung.');
  const name=pilotName(); store.set('sb-name',name);
  if (mode==='online' && !isHost && gameCode===code && hostConn && hostConn.open){ hostConn.send({type:'hello',id:myId,name,ship:pickedShip}); return; }
  detach(); mode='online'; isHost=false; gameCode=code; state=null; hadGameState=false; lastVia='';
  store.set('sb-online',{code,host:false});
  showView('loading'); $('#loadingHint').textContent=`Suche den Hangar ${code} …`;
  joinTimer=setTimeout(()=>{ if (!state && gameCode===code) $('#loadingHint').textContent='Das dauert länger als üblich. Ist der Gastgeber online?'; },12000);
  connectToHost(code);
}
async function resumeOnline(){
  const sv=getSaved(); if (!sv) return;
  if (!sv.host) return joinOnline(sv.code);
  const S=store.get('sb-host-'+sv.code);
  if (!S){ store.del('sb-online'); toast('Dieses Spiel ist auf diesem Gerät nicht mehr gespeichert.'); return renderMenu(); }
  detach(); showView('loading'); $('#loadingHint').textContent=`Hangar ${sv.code} wird wieder geöffnet …`;
  let p=null;
  if (typeof window.Peer==='function'){
    try { p=await openHostPeer(sv.code); }
    catch(e){ if (e && e.type==='unavailable-id'){ toast('Der Code ist noch belegt. Versuch es in einer Minute noch einmal.'); goMenu(); return; } p=null; }
  }
  if (!p && !RELAY_ON()){ toast('Der Vermittlungsdienst ist gerade nicht erreichbar.'); goMenu(); return; }
  peer=p; isHost=true; mode='online'; gameCode=sv.code; if (p) wireHostPeer(p); hostOpenRelays(sv.code);
  state=null; hadGameState=false; hostAccept(S);
}
function goMenu(){ hideEnd(); detach(); mode=null; state=null; hadGameState=false; selectedTile=null; follow.id=null; syncTokens(null); syncProps(null); highlightTile(); closeModal(); showView('menu'); }
function leaveLobby(){
  if (isHost){ hostBroadcast({type:'closed'}); store.del('sb-host-'+gameCode); }
  else if (hostConn && hostConn.open){ try { hostConn.send({type:'leave'}); } catch(e){} }
  store.del('sb-online'); setTimeout(goMenu,200);
}
function startOnline(){
  const S=state; if (!S || !isHost) return;
  const list=Object.entries(S.lobby||{}).filter(([,v])=>v).sort((a,b)=>a[1].t-b[1].t).slice(0,6).map(([id,v])=>({id,name:v.name,ship:v.ship}));

const handlers={
  tab:d=>{ if (d.tab===menuTab) return; if (menuTab==='local') saveLocal(); menuTab=d.tab; store.set('sb-tab',menuTab); const seg=$('.seg'); seg.dataset.tab=menuTab; seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===menuTab))); renderPane(); },
  ship:d=>{ pickedShip=+d.k; store.set('sb-ship',pickedShip); document.querySelectorAll('#shipPick .ship').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.k===pickedShip))); $('#shipName').textContent=SHIPS[pickedShip].name; },
  cnt:d=>{ saveLocal(); localCount=clamp(localCount+(+d.d),2,6); store.set('sb-localCount',localCount); renderPane(); },
  create:()=>createOnline(),
  join:()=>joinOnline($('#inCode').value),
  joinCode:d=>joinOnline(d.code),
  resumeOnline:()=>resumeOnline(),
  resumeLocal:()=>{ const S=store.get('sb-local'); if (!S) return; mode='local'; gameCode=null; hadGameState=false; onState(S); },
  startLocal:()=>startLocal(),
  menu:()=>goMenu(),
  rules:()=>openModal('rules'),
  log:()=>openModal('log'),
  copyCode:()=>{ const code=state?.code||''; try { navigator.clipboard.writeText(code).then(()=>toast('Code kopiert.',true),()=>selectCode()); } catch(e){ selectCode(); } },
  startOnline:()=>startOnline(),
  leaveLobby:()=>leaveLobby(),
  deleteGame:()=>{ if (isHost){ hostBroadcast({type:'closed'}); store.del('sb-host-'+gameCode); } store.del('sb-online'); setTimeout(goMenu,200); },
  roll:()=>commit(actRoll),
  buy:()=>commit(actBuy),
  pass:()=>commit(actPass),
  bet:d=>commit(S=>actBet(S,+d.s)),
  payJail:()=>commit(actPayJail),
  jailCard:()=>commit(actJailCard),
  end:()=>commit(actEnd),
  bankrupt:()=>commit(S=>actBankrupt(S,curId(S))),
  forceSkip:()=>commit(actForceSkip),
  manage:()=>openModal('manage'),
  tile:d=>openTile(+d.i),
  buildOpen:()=>openModal('build'),
  buildGroup:d=>commit(S=>actBuildGroup(S,actorId(),+d.g)),
  build:d=>commit(S=>actBuild(S,actorId(),+d.i)),
  sell:d=>commit(S=>actSell(S,actorId(),+d.i)),
  mort:d=>commit(S=>actMort(S,actorId(),+d.i)),
  unmort:d=>commit(S=>actUnmort(S,actorId(),+d.i)),
  trade:()=>openModal('trade',null),
  tradeSend:()=>{
    const S=state, me=actorId(), to=$('#trPartner').value;
    const pick=side=>[...modal.querySelectorAll(`input[data-side="${side}"]:checked`)].map(x=>+x.value);
    const t={from:me,to,give:{props:pick('give'),money:Math.max(0,Math.floor(+$('#trGiveM').value||0))},get:{props:pick('get'),money:Math.max(0,Math.floor(+$('#trGetM').value||0))}};
    const err=tradeErr(S,t); if (err){ sfx.play('error'); return toast(err); }
    closeModal(); commit(S=>actPropose(S,t));
  },
  tradeYes:()=>commit(S=>actTradeAnswer(S,true)),
  tradeNo:()=>commit(S=>actTradeAnswer(S,false)),
  tradeCancel:()=>commit(actTradeCancel),
  close:()=>closeModal(),
};
function selectCode(){ const el=$('#codeText'); if (!el) return; const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Code markiert – jetzt kopieren.'); }
function onAct(e){
  const b=e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a=b.dataset.act, h=handlers[a]; if (!h) return;
  if (GAME_ACTS.has(a) && (writing||animating)) return;
  e.preventDefault(); if (!['roll','buy','dice'].includes(a)) sfx.play('tap'); h(b.dataset);
}
document.addEventListener('click',e=>{ if (e.target.closest('#v-menu,#v-lobby,#v-loading,#v-game,#modal')) onAct(e); });
document.addEventListener('keydown',e=>{ if (e.key==='Enter' && e.target.id==='inCode') joinOnline(e.target.value); });
document.addEventListener('input',e=>{ if (e.target.id==='inName') store.set('sb-name',e.target.value.trim().slice(0,16)); });

/* ============================================================ boot */
async function boot(){
  try { await Promise.race([Promise.all(['700 40px Rajdhani','600 40px Rajdhani','600 16px Inter'].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,2500))]); } catch(e){}
  buildBoard(); resize(); showView('menu'); renderMenu(); requestAnimationFrame(loop);
  myId=getPid(); P2P=typeof window.Peer==='function' || RELAY_ON();
  capsReady=true;
  if (view==='menu') renderMenu();
}
boot();
</script>

</body>
</html>
